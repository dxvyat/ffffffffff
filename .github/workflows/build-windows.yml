name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained executable
        run: dotnet publish .\DXVPrivateTweek.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
      - uses: actions/upload-artifact@v4
        with:
          name: DXVPrivateTweek-win-x64
          path: publish/DXVPrivateTweek.exe
